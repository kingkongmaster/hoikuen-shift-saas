name: PR Quality

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  static:
    name: Static quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json

      - name: Check diff whitespace
        run: git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"

      - name: Install API dependencies
        working-directory: apps/api
        run: npm ci

      - name: Generate Prisma client
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/enshift_ci_test
        run: npm run db:generate

      - name: Validate Prisma schema
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/enshift_ci_test
        run: npx prisma validate

      - name: Lint API
        working-directory: apps/api
        run: npm run lint

      - name: Build API
        working-directory: apps/api
        run: npm run build

      - name: Run production hardening tests
        working-directory: apps/api
        run: npm run test:production-hardening

      - name: Run isolated database safety guard tests
        working-directory: apps/api
        run: npm run test:db-safety

      - name: Run paid leave timezone tests
        working-directory: apps/api
        run: npm run test:paid-leave:phase4a:db-free

      - name: Install Web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Lint Web
        working-directory: apps/web
        run: npm run lint

      - name: Build Web
        working-directory: apps/web
        run: npm run build

      - name: Run Web regression
        working-directory: apps/web
        run: npm run test:regression

  isolated-db:
    name: Isolated database regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: enshift_ci_test
          POSTGRES_USER: enshift_ci
          POSTGRES_PASSWORD: ci-only-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U enshift_ci -d enshift_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: development
      DEPLOYMENT_ENV: development
      DATABASE_URL: postgresql://enshift_ci:ci-only-postgres-password@127.0.0.1:5432/enshift_ci_test
      TEST_DATABASE_URL: postgresql://enshift_ci:ci-only-postgres-password@127.0.0.1:5432/enshift_ci_test
      TEST_DATABASE_ISOLATED: "true"
      API_BASE_URL: http://127.0.0.1:18084/api
      API_PORT: "18084"
      DATABASE_CONNECT_ON_STARTUP: "true"
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters
      JWT_EXPIRES_IN: 8h
      WEB_ORIGIN: http://127.0.0.1:18084
      TRUST_PROXY: "0"
      LOG_LEVEL: error
      SEED_DEMO_DATA: "true"
      SEED_OWNER_EMAIL: owner@demo.enshift.local
      SEED_OWNER_PASSWORD: ChangeMe123!
      SEED_STAFF_PASSWORD: ChangeMe123!
      DEMO_USER_PASSWORD: ChangeMe123!
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install API dependencies
        working-directory: apps/api
        run: npm ci

      - name: Generate Prisma client
        working-directory: apps/api
        run: npm run db:generate

      - name: Build API
        working-directory: apps/api
        run: npm run build

      - name: Verify isolated database target
        working-directory: apps/api
        run: node test/helpers/isolated-database.cjs

      - name: Apply migrations to isolated database
        working-directory: apps/api
        run: npx prisma migrate deploy

      - name: Seed isolated test fixtures
        working-directory: apps/api
        run: npm run db:seed

      - name: Start local API
        working-directory: apps/api
        run: |
          npm run start > "$RUNNER_TEMP/enshift-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/enshift-api.pid"
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18084/api/ready > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/enshift-api.log"
          exit 1

      - name: Run API regression
        working-directory: apps/api
        run: npm run test:regression

      - name: Run tenant database constraints
        working-directory: apps/api
        run: npm run test:tenant-phase1-db
