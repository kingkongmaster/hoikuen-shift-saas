x-compose-database-url: &compose-database-url postgresql://${POSTGRES_USER:-enshift}:${COMPOSE_POSTGRES_PASSWORD:?Set COMPOSE_POSTGRES_PASSWORD in the untracked local .env}@postgres:5432/${POSTGRES_DB:-enshift}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-enshift}
      POSTGRES_USER: ${POSTGRES_USER:-enshift}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    environment:
      API_PORT: ${API_PORT:-3000}
      NODE_ENV: development
      DATABASE_URL: *compose-database-url
      DATABASE_CONNECT_ON_STARTUP: "true"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  migrate:
    build:
      context: ./apps/api
      target: migration
    command: node scripts/migration.cjs deploy
    environment:
      DATABASE_URL: *compose-database-url
      DEPLOYMENT_ENV: development
      DATABASE_TARGET_ID: local-compose-postgres
      CONFIRM_DATABASE_TARGET_ID: local-compose-postgres
      CONFIRM_DEPLOYMENT_ENV: development
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    profiles: ["seed"]
    build:
      context: ./apps/api
      target: build
    command: node prisma/seed.cjs
    environment:
      NODE_ENV: development
      DEPLOYMENT_ENV: development
      DATABASE_URL: *compose-database-url
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      SEED_OWNER_EMAIL: ${SEED_OWNER_EMAIL:-owner@demo.enshift.local}
      SEED_OWNER_PASSWORD: ${SEED_OWNER_PASSWORD:-ChangeMe123!}
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./apps/web
      args:
        # Compose版は同一オリジンのnginx proxyを必ず使用する。
        # ホスト開発用VITE_API_BASE_URLを誤って取り込まない。
        VITE_API_BASE_URL: /api
    ports:
      - "8080:80"
    environment:
      PORT: 80
      API_UPSTREAM: http://api:3000
    depends_on:
      - api

  api-test:
    profiles: ["test"]
    build:
      context: ./apps/api
      target: build
    command: npm run test:all
    environment:
      DATABASE_URL: *compose-database-url
      TEST_DATABASE_ISOLATED: "true"
      API_BASE_URL: http://web/api
      SEED_OWNER_EMAIL: ${SEED_OWNER_EMAIL:-owner@demo.enshift.local}
      SEED_OWNER_PASSWORD: ${SEED_OWNER_PASSWORD:-ChangeMe123!}
    depends_on:
      web:
        condition: service_started

volumes:
  postgres_data:
